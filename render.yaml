services:
  - type: web
    name: cupcake-gg
    runtime: node
    plan: free
    buildCommand: echo "aucune dépendance"
    startCommand: node server.js
    healthCheckPath: /api/config
    envVars:
      - key: RIOT_API_KEY
        sync: false
      - key: DEFAULT_PLATFORM
        value: euw1
      - key: DEMO
        value: "1"
      - key: AUTO_META_HOURS
        value: "6"
      - key: AUTO_META_GAMES
        value: "50"
